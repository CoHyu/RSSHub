name: Build Custom RSSHub

on:
  push:
    branches:
      - custom/osu-api-v2
    paths:
      - 'lib/**'
      - 'Dockerfile'
      - '.github/workflows/custom-ghcr.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/cohyu/rsshub:osu-api-v2
            ghcr.io/cohyu/rsshub:osu-api-v2-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/CoHyu/RSSHub
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=custom-rsshub-amd64
          cache-to: type=gha,mode=max,scope=custom-rsshub-amd64
